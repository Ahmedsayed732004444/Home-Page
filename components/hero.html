<!-- Ambient Glow effect in Hero section -->
    <div class="absolute top-[40px] sm:top-[80px] left-1/2 -translate-x-1/2 w-[90%] max-w-[900px] h-[320px] sm:h-[580px] rounded-full bg-gradient-to-b from-[#D6DFEA]/50 to-[#D6DFEA]/20 blur-[60px] sm:blur-[90px] pointer-events-none -z-10"></div>

    <!-- ==================== 2. HERO SECTION: اختبار عجلة الحياة (#937:4162) ==================== -->
    <section class="pt-10 sm:pt-16 pb-14 sm:pb-24 px-4 sm:px-6 md:px-12 relative flex flex-col items-center">

      <!-- Main Section Header -->
      <div class="text-center max-w-[820px] mx-auto mb-6 sm:mb-10 relative flex flex-col items-center">
        
        <!-- Heading: Big Star (Sparkle) on the LEFT (end of line in RTL, next to تطورك) -->
        <div class="inline-flex items-center justify-center gap-2 sm:gap-3.5 mb-3">
          <h1 class="text-[26px] sm:text-[34px] md:text-[43px] font-bold text-brand-primary leading-none" style="font-family: 'El Messiri', sans-serif;">
            اكتشف نفسك ... وابدأ رحلة تطورك
          </h1>
          <img src="/images/icons/sparkle.svg" alt="" class="w-[22px] h-[22px] sm:w-[28px] sm:h-[28px] shrink-0 pointer-events-none" />
        </div>

        <!-- Subtitle: Small Star (StarFour) on the RIGHT (start of line in RTL, next to قياسات) - 19.4px x 19.4px, 12.47 deg, #204A7A -->
        <div class="inline-flex items-center justify-center gap-2 sm:gap-3">
          <svg class="w-[19.4px] h-[19.4px] text-[#204A7A] shrink-0 pointer-events-none" style="transform: rotate(12.47deg);" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C12 6.627 6.627 12 0 12C6.627 12 12 17.373 12 24C12 17.373 17.373 12 24 12C17.373 12 12 6.627 12 0Z"/>
          </svg>
          <p class="text-[15px] sm:text-[19px] md:text-[25px] font-normal text-[#262626] leading-none" style="font-family: 'El Messiri', sans-serif;">
            قياسات ذكية لفهم ذاتك، شخصيتك، وتوازنك في الحياة.
          </p>
        </div>

      </div>

      <!-- ==================== THE WHEEL OF LIFE (عجلة الحياة) ==================== -->
      <div class="w-full max-w-[1000px] mx-auto relative flex flex-col items-center justify-center my-6 px-2">

        <!-- Outer Radial Wheel Graphic -->
        <div class="relative w-full max-w-[834.43px] flex items-center justify-center overflow-visible" style="aspect-ratio: 834.43 / 869.75;">
          <div id="wheel-wrap" class="w-full h-full relative z-10">
            <svg id="wheelSvg" viewBox="0 0 834.43 869.75" xmlns="http://www.w3.org/2000/svg" class="w-full h-full overflow-visible" style="overflow: visible;"></svg>
          </div>
        </div>

        <div id="admin-wheel-controls" class="hidden flex-col gap-4 mt-8 w-full max-w-[900px] bg-white rounded-2xl p-6 shadow-md border border-gray-200 z-10 relative">
          <h2 class="text-xl font-bold text-brand-primary mb-2">لوحة تحكم العجلة (للمشرفين)</h2>
          <div id="general-controls">
            <!-- Generated by newLifeWheel.js -->
            <label>
              زاوية الدوران
              <div class="row">
                <input type="range" id="rotationSlider" min="0" max="359" step="1" value="0">
                <span id="rotationVal" style="width:44px;text-align:center;font-weight:700;color:var(--text-strong);">0&deg;</span>
              </div>
            </label>
            <label>
              اتجاه الدوران
              <select id="spinDirectionSelect">
                <option value="cw">يمين (مع عقارب الساعة)</option>
                <option value="ccw">شمال (عكس عقارب الساعة)</option>
              </select>
            </label>
            <label class="checkbox-row">
              <input type="checkbox" id="autoSpinToggle">
              تدوير تلقائي مستمر
            </label>
            <label>
              صورة في منتصف العجلة
              <div class="row">
                <input type="file" id="centerImageInput" accept="image/*">
                <button id="removeImageBtn" type="button">مسح الصورة</button>
              </div>
            </label>
            <label>
              نتيجة آخر دورة
              <span id="spinResult">&mdash;</span>
            </label>
          </div>
          <div id="controls" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4"></div>
        </div>
      </div>

      <!-- Heading CTA (#875:7304) -->
      <div class="text-center mt-8 sm:mt-12 mb-6 px-2">
        <p class="text-[17px] sm:text-[22px] md:text-[28px] font-medium text-brand-dark mb-1">
          اكتشف مستوى التوازن فى أهم جوانب حياتك باستخدام
        </p>
        <h2 class="text-[24px] sm:text-[30px] md:text-[38px] font-bold text-brand-primary">
          اختبار عجلة الحياة
        </h2>
      </div>

      <!-- CTA Offer Card (#951:4239) matching Figma -->
      <div class="w-full max-w-[797px] min-h-[139px] bg-[#F5F8FC] border-[1.05px] border-[#204A7A]/25 rounded-[22px] px-5 sm:px-10 py-4 flex flex-col sm:flex-row items-center justify-center sm:justify-between gap-4 shadow-sm my-6">

        <!-- Right Promotional Text (First child in RTL) -->
        <div class="text-right flex items-center gap-4 sm:gap-6">
          <div class="flex items-center justify-center">
            <img src="/images/icons/alarm-clock.svg" alt="Alarm Clock" class="w-10 h-10 sm:w-16 sm:h-16 object-contain" />
          </div>
          <div>
            <span class="text-[24px] sm:text-[32px] md:text-[40px] font-bold text-brand-primary block leading-none">مجاني</span>
            <span class="text-[18px] sm:text-[24px] md:text-[32px] font-normal text-brand-primary block">لفترة محدودة</span>
          </div>
        </div>

        <!-- Left Gift Box Image / Vector (Last child in RTL) -->
        <div class="w-16 h-16 sm:w-28 sm:h-28 flex items-center justify-center">
          <img src="/images/icons/wrapped-gift.svg" alt="Gift Box" class="w-full h-full object-contain transform scale-[1.3] drop-shadow-sm" />
        </div>

      </div>

      <!-- Action Buttons (#875:6123) -->
      <div class="flex flex-row items-stretch justify-center gap-[20px] sm:gap-[70px] mt-2 mb-6 w-full max-w-[797px] px-4 sm:px-0">
        <!-- Start Evaluation Button -->
        <a href="#challenge" class="group flex-1 h-[60px] sm:h-[70px] bg-brand-primary text-white rounded-[12px] sm:rounded-[15px] font-semibold text-[14px] sm:text-[21px] flex items-center justify-center gap-1.5 sm:gap-3 shadow-md hover:bg-[#102744] hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 border-2 border-brand-primary cursor-pointer whitespace-nowrap">
          <span>ابدأ التقييم الآن</span>
          <i class="fa-solid fa-arrow-left text-sm group-hover:-translate-x-1.5 transition-transform duration-200"></i>
        </a>

        <!-- Explore Wheel Button -->
        <a href="#assessments" class="group flex-1 h-[60px] sm:h-[70px] border-2 border-brand-primary text-brand-primary rounded-[12px] sm:rounded-[15px] font-semibold text-[14px] sm:text-[21px] flex items-center justify-center hover:bg-brand-primary hover:text-white transition-all duration-200 shadow-sm hover:shadow-md cursor-pointer whitespace-nowrap">
          <span>اكتشف عجلة الحياة</span>
        </a>
      </div>

    </section>
