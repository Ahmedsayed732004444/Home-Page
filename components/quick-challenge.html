<!-- ==================== 5. SECTION: التحدي السريع (#943:4131) ==================== -->
    <section id="challenge" class="py-12 sm:py-16 md:py-20 px-4 sm:px-6 md:px-12 flex flex-col items-center">

      <div class="text-center mb-8 sm:mb-10 px-2 w-full flex flex-col items-center">
        <!-- Title and Marks Block -->
        <div class="flex flex-row items-center justify-center gap-2 sm:gap-6 mb-[30px]">
          
          <!-- Right Mark (Visual Right in RTL) -->
          <div class="flex items-center w-[50px] sm:w-[136px]" dir="ltr">
            <!-- Diamond is closest to text (left side of this block) -->
            <div class="w-[6px] h-[6px] sm:w-[8px] sm:h-[8px] rotate-45 bg-[#204A7A] shrink-0 mx-1 sm:mx-2"></div>
            <!-- Line fades to the right (away from text) -->
            <div class="flex-1 h-[1.5px] bg-gradient-to-r from-[#204A7A] to-transparent"></div>
          </div>
          
          <!-- Text -->
          <h2 class="text-[18px] sm:text-[36px] text-brand-primary" style="font-family: 'El Messiri', sans-serif; font-weight: 600; line-height: 1.5;">التحدي السريع</h2>

          <!-- Left Mark (Visual Left in RTL) -->
          <div class="flex items-center w-[50px] sm:w-[136px]" dir="ltr">
            <!-- Line fades to the left (away from text) -->
            <div class="flex-1 h-[1.5px] bg-gradient-to-l from-[#204A7A] to-transparent"></div>
            <!-- Diamond is closest to text (right side of this block) -->
            <div class="w-[6px] h-[6px] sm:w-[8px] sm:h-[8px] rotate-45 bg-[#204A7A] shrink-0 mx-1 sm:mx-2"></div>
          </div>

        </div>

        <!-- Subtitle -->
        <p class="text-[13.5px] sm:text-[22px] md:text-[30px] font-medium text-brand-dark leading-normal sm:leading-none text-center" style="font-family: 'El Messiri', sans-serif; font-weight: 500;">
          اختبر دقة ملاحظتك للأنماط والتفاصيل.
        </p>
      </div>

      <!-- Interactive Aptitude Challenge Quiz Widget matching reference design -->
      <div id="quiz-widget" class="w-full max-w-[820px] sm:max-w-[1000px] md:max-w-[1240px] bg-white rounded-[24px] sm:rounded-[32px] md:rounded-[40px] border border-[#DDE4ED] shadow-[0px_4px_30px_rgba(0,0,0,0.04)] p-4 sm:p-6 md:p-[40px] transition-all duration-300">

        <!-- Question View -->
        <div id="quiz-question-card" class="bg-[#F6F9FC] rounded-[20px] p-6 sm:p-8 md:p-[50px] border border-[#EDF2F7] transition-all duration-200">
          <!-- Top Bar: Progress dashes + question counter -->
          <div class="flex items-center justify-between mb-4 sm:mb-8">
            <span id="quiz-counter" class="text-xs sm:text-[16px] font-semibold text-gray-500 font-cairo">سؤال 1 من 3</span>
            <div id="quiz-progress-dots" class="flex items-center gap-1.5 sm:gap-2" dir="ltr">
              <span class="quiz-dash w-7 sm:w-8 h-2 sm:h-2.5 rounded-full bg-[#204A7A] transition-all duration-300"></span>
              <span class="quiz-dash w-3.5 sm:w-4 h-1.5 sm:h-2 rounded-full bg-[#CBD5E1] transition-all duration-300"></span>
              <span class="quiz-dash w-3.5 sm:w-4 h-1.5 sm:h-2 rounded-full bg-[#E2E8F0] transition-all duration-300"></span>
            </div>
          </div>

          <!-- Question title -->
          <h4 id="quiz-question-title" class="text-[18px] sm:text-[24px] md:text-[30px] text-[#262626] mb-6 text-right leading-none" style="font-family: 'El Messiri', sans-serif; font-weight: 500;">
            ما الشكل التالي في النمط؟
          </h4>

          <!-- Pattern sequence illustration container (visible for pattern questions) -->
          <div id="quiz-pattern-container" class="hidden my-6">
            <!-- Dynamically populated if pattern question -->
          </div>

          <!-- Options Grid / Row Container -->
          <div id="quiz-options-container" class="grid grid-cols-2 gap-4 sm:gap-5 my-6 sm:my-8">
            <!-- Dynamically populated from questions list -->
          </div>

          <!-- Action Button: ابدأ التحدي / التالي / شاهد نتيجتك -->
          <div class="flex justify-center w-full mt-6 sm:mt-8">
            <button id="quiz-action-btn" disabled class="w-full max-w-[671px] h-[56px] md:h-[71px] rounded-[14px] md:rounded-[18px] bg-[#BAC7D5] text-white font-bold text-[18px] sm:text-[22px] font-cairo flex items-center justify-center gap-[14px] cursor-not-allowed transition-all duration-200 shadow-sm">
              <span id="quiz-btn-text">ابدأ التحدي</span>
              <svg class="w-4 h-4 sm:w-5 sm:h-5 fill-current shrink-0" viewBox="0 0 24 24"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/><circle cx="19" cy="5" r="1.5" /><circle cx="5" cy="19" r="1.5" /></svg>
            </button>
          </div>
        </div>

        <!-- Result View (Hidden initially) -->
        <div id="quiz-result-card" class="hidden bg-[#F8FAFC] rounded-[24px] sm:rounded-[30px] p-8 sm:p-12 border border-[#EDF2F7] text-center flex flex-col items-center relative overflow-hidden">
          <!-- Top Indicator Bar matching reference -->
          <span class="w-12 sm:w-14 h-1.5 rounded-full bg-brand-primary block mb-6"></span>

          <!-- 3D Golden Trophy with celebratory glow -->
          <div class="relative mb-5 flex items-center justify-center">
            <div class="absolute inset-0 w-28 h-28 rounded-full bg-[#F59E0B]/20 blur-xl animate-pulse pointer-events-none"></div>
            <img id="quiz-trophy-img" src="/images/icons/trophy.png" alt="كأس التفوق" class="w-20 h-20 sm:w-24 sm:h-24 md:w-28 md:h-28 object-contain relative z-10 animate-trophy-pop trophy-glow" />
          </div>

          <!-- Result Headline -->
          <h3 id="quiz-result-title" class="text-[26px] sm:text-[32px] md:text-[36px] font-bold text-[#102744] mb-3 font-cairo">محاولة جيدة!</h3>

          <!-- Result Score Text matching user reference -->
          <p id="quiz-score-text" class="text-[#334155] text-[17px] sm:text-[20px] md:text-[22px] font-cairo mb-8">
            أجبت على <span id="quiz-score-num" class="text-brand-primary font-bold text-[20px] sm:text-[24px]">3</span> من <span id="quiz-total-num" class="font-bold text-[20px] sm:text-[24px]">3</span> أسئلة بشكل صحيح
          </p>

          <!-- Action Buttons -->
          <div class="flex flex-col sm:flex-row items-center gap-4 w-full max-w-[480px]">
            <button id="quiz-restart-btn" class="w-full h-[54px] rounded-[18px] border-2 border-brand-primary text-brand-primary font-bold hover:bg-brand-primary hover:text-white transition-all duration-200 font-cairo text-[17px] shadow-sm hover:shadow-md cursor-pointer">
              إعادة التحدي
            </button>
            <a href="#assessments" class="w-full h-[54px] rounded-[18px] bg-brand-primary text-white font-bold hover:bg-[#102744] shadow-md hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-center font-cairo text-[17px] cursor-pointer border-2 border-brand-primary">
              اكتشف مقاييسك
            </a>
          </div>
        </div>

      </div>

    </section>
